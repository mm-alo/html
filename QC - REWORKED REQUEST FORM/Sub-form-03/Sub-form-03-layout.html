<!DOCTYPE html>
<html lang="en">    
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REWORKED REQUEST FORM</title>
</head>
<body>
<div style="border:2px solid #000;padding:12px 20px;width:420px;font-family:Arial,Helvetica,sans-serif;">

    <div style="font-size:16px;font-weight:bold;margin-bottom:18px;">
        CAR ISSUANCE
    </div>

    <input type="hidden" name="DynamicHidden" value="CarIssuance">
    <input type="hidden" id="CarIssuance" name="DynamicInput">

    <div style="margin-left:55px;margin-bottom:12px;display:flex;align-items:center;">
        <input class="myRad"
               type="radio"
               required=""
               onchange="GetValueRadio(`CarIssuance`)"
               id="rad_CarIssuanceissue car"
               name="rad_CarIssuance"
               value="issue car"
               style="width:14px;height:14px;margin-right:12px;">

        <label for="rad_CarIssuanceissue car"
               style="font-size:16px;font-weight:bold;">
            ISSUE CAR
        </label>
    </div>

    <div style="margin-left:55px;display:flex;align-items:center;">
        <input class="myRad"
               type="radio"
               required=""
               onchange="GetValueRadio(`CarIssuance`)"
               id="rad_CarIssuanceno need to raise car"
               name="rad_CarIssuance"
               value="no need to raise car"
               style="width:14px;height:14px;margin-right:12px;">

        <label for="rad_CarIssuanceno need to raise car"
               style="font-size:16px;font-weight:bold;">
            NO NEED TO RAISE CAR
        </label>
    </div>

</div>
</body>
</html>
