<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Article Approval Notice</title>
</head>

<body style="margin:0; padding:8px; background-color:#ffffff; font-family:Arial, Helvetica, sans-serif; color:#000000;">

    <div style="width:650px; margin:0; border:2px solid #000000; box-sizing:border-box; background-color:#ffffff;">

        <!-- APPROVAL STATEMENT -->
        <div style="height:42px; display:flex; align-items:center; justify-content:center; padding:4px 8px; border-bottom:1px solid #000000; box-sizing:border-box; font-size:11px; line-height:15px; font-weight:bold; text-align:center;">
            ABOVE LISTED PRODUCT / PROCESS IS APPROVED FOR MASS PRODUCTION
        </div>

        <!-- APPROVAL AREA -->
        <div style="display:flex; width:100%; height:185px; padding:20px 26px 18px 26px; box-sizing:border-box;">

            <!-- LEFT SECTION -->
            <div style="flex:1; position:relative; height:100%; box-sizing:border-box;">

                <div style="display:inline-flex; align-items:center; justify-content:center; height:27px; padding:3px 8px; border:2px solid #000000; box-sizing:border-box; font-size:10px; line-height:15px; font-weight:bold; text-align:center;">
                    SPH QUALITY CONTROL DIVISION
                </div>

                <div style="position:absolute; left:0; bottom:17px; display:flex; align-items:flex-start; width:315px; box-sizing:border-box;">

                    <div style="flex:0 0 116px; padding-top:3px; box-sizing:border-box; font-size:11px; line-height:18px; font-weight:bold; white-space:nowrap;">
                        QC MANAGEMENT
                    </div>

                    <div style="flex:1; box-sizing:border-box;">

                        <input type="hidden" name="DynamicHidden" value="qcmanagement">
                        <input type="textbox" name="DynamicInput" class="form-control k-textbox" id="qcmanagement" style="display:block; width:100%; height:22px; margin-left:0px; padding:1px 3px; border:0 !important; border-bottom:1px solid #000000 !important; border-radius:0 !important; box-shadow:none !important; outline:none !important; box-sizing:border-box; background-color:transparent !important; font-family:Arial, Helvetica, sans-serif; font-size:10px; line-height:18px;" required="required" minlength="1" maxlength="999">

                        <div style="display:flex; justify-content:center; width:100%; margin-top:3px; box-sizing:border-box;">
                            <input type="hidden" name="DynamicHidden" value="qcdate">
                            <input type="date" class="form-control" name="DynamicInput" id="qcdate" placeholder="Select date" inline="true" style="margin-left:0px; border-radius:7px; width:105px; height:20px; padding:0 2px; border:0 !important; box-shadow:none !important; outline:none !important; box-sizing:border-box; background-color:#ffffff; font-family:Arial, Helvetica, sans-serif; font-size:8px;">
                        </div>

                    </div>

                </div>

            </div>

            <!-- FA JUDGEMENT -->
            <div style="flex:0 0 230px; height:130px; margin-left:24px; border:2px solid #000000; box-sizing:border-box;">

                <div style="height:30px; display:flex; align-items:center; justify-content:center; border-bottom:1px solid #000000; box-sizing:border-box; font-size:10px; line-height:15px; font-weight:bold; text-align:center;">
                    FA JUDGEMENT
                </div>

                <div style="display:flex; width:100%; height:27px; border-bottom:1px solid #000000; box-sizing:border-box;">

                    <div style="width:50%; display:flex; align-items:center; justify-content:center; border-right:1px solid #000000; box-sizing:border-box; font-size:9px; line-height:13px; font-weight:bold; text-align:center;">
                        FA ACCEPTED
                    </div>

                    <div style="width:50%; display:flex; align-items:center; justify-content:center; box-sizing:border-box; font-size:9px; line-height:13px; font-weight:bold; text-align:center;">
                        FA NC
                    </div>

                </div>

                <div style="display:flex; width:100%; height:69px; box-sizing:border-box;">

                    <div style="width:50%; height:100%; border-right:1px solid #000000; box-sizing:border-box;">

                        <input type="hidden" name="DynamicHidden" value="faaccepted">

                        <textarea type="textarea"
                                  name="DynamicInput"
                                  class="form-control k-textbox"
                                  id="faaccepted"
                                  rows="5"
                                  style="display:block; width:100%; height:100%; margin-left:0px; padding:4px; border:0 !important; border-radius:0 !important; box-shadow:none !important; outline:none !important; resize:none; overflow:auto; box-sizing:border-box; background-color:transparent !important; font-family:Arial, Helvetica, sans-serif; font-size:10px; line-height:14px;"
                                  required="required"
                                  minlength="1"
                                  maxlength="999"></textarea>

                    </div>

                    <div style="width:50%; height:100%; box-sizing:border-box;">

                        <input type="hidden" name="DynamicHidden" value="fanc">

                        <textarea type="textarea"
                                  name="DynamicInput"
                                  class="form-control k-textbox"
                                  id="fanc"
                                  rows="5"
                                  style="display:block; width:100%; height:100%; margin-left:0px; padding:4px; border:0 !important; border-radius:0 !important; box-shadow:none !important; outline:none !important; resize:none; overflow:auto; box-sizing:border-box; background-color:transparent !important; font-family:Arial, Helvetica, sans-serif; font-size:10px; line-height:14px;"
                                  required="required"
                                  minlength="1"
                                  maxlength="999"></textarea>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
