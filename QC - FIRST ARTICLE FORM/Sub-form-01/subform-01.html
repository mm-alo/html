<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Article Approval Notice</title>
</head>

<body style="margin:0; padding:8px; background:#ffffff; font-family:Arial, Helvetica, sans-serif; color:#000000;">

    <table style="width:650px; margin:0; border-collapse:collapse; table-layout:fixed; background:#ffffff;">
        <colgroup>
            <col style="width:320px;">
            <col style="width:165px;">
            <col style="width:165px;">
        </colgroup>

        <thead>
            <tr>
                <th style="height:32px; padding:3px 5px; border:1px solid #000000; box-sizing:border-box; font-size:12px; font-weight:700; line-height:14px; text-align:center; vertical-align:middle;">
                    ACCEPTED / NC CONDITION
                </th>

                <th style="height:32px; padding:3px 5px; border:1px solid #000000; box-sizing:border-box; font-size:12px; font-weight:700; line-height:14px; text-align:center; vertical-align:middle;">
                    PDA / ISSUER (SPH)
                </th>

                <th style="height:32px; padding:3px 5px; border:1px solid #000000; box-sizing:border-box; font-size:12px; font-weight:700; line-height:14px; text-align:center; vertical-align:middle;">
                    SPH QC
                </th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td style="height:130px; padding:0; border:1px solid #000000; box-sizing:border-box; vertical-align:top;">
                    <input type="hidden" name="DynamicHidden" value="ACcepted/Nc_conditon">
                    <textarea type="textarea" name="DynamicInput" class="form-control k-textbox" id="ACcepted/Nc_conditon" rows="5" style="display:block; width:100%; height:128px; min-height:128px; margin-left:0px; padding:5px; border:0 !important; border-radius:0 !important; box-shadow:none !important; outline:none !important; resize:none; overflow:auto; box-sizing:border-box; background:transparent !important; font-family:Arial, Helvetica, sans-serif; font-size:11px; line-height:14px;" required="required" minlength="1" maxlength="999"></textarea>
                </td>

                <td style="height:130px; padding:0; border:1px solid #000000; box-sizing:border-box; vertical-align:top;">
                    <input type="hidden" name="DynamicHidden" value="pda/_issuer_(sph)">
                    <textarea type="textarea" name="DynamicInput" class="form-control k-textbox" id="pda/_issuer_(sph)" rows="5" style="display:block; width:100%; height:128px; min-height:128px; margin-left:0px; padding:5px; border:0 !important; border-radius:0 !important; box-shadow:none !important; outline:none !important; resize:none; overflow:auto; box-sizing:border-box; background:transparent !important; font-family:Arial, Helvetica, sans-serif; font-size:11px; line-height:14px;" required="required" minlength="1" maxlength="999"></textarea>
                </td>

                <td style="height:130px; padding:0; border:1px solid #000000; box-sizing:border-box; vertical-align:top;">
                    <input type="hidden" name="DynamicHidden" value="sph_qc">
                    <textarea type="textarea" name="DynamicInput" class="form-control k-textbox" id="sph_qc" rows="5" style="display:block; width:100%; height:128px; min-height:128px; margin-left:0px; padding:5px; border:0 !important; border-radius:0 !important; box-shadow:none !important; outline:none !important; resize:none; overflow:auto; box-sizing:border-box; background:transparent !important; font-family:Arial, Helvetica, sans-serif; font-size:11px; line-height:14px;" required="required" minlength="1" maxlength="999"></textarea>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
